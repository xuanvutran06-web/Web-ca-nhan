<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chương Trình Khuyến Mại - NLS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Chương Trình Khuyến Mại - NLS</h1>

    <form>
      <div class="section">
        <label><strong>Rượu/Bia ≥ 15 độ?</strong></label><br>
        <label><input type="radio" name="alcohol" value="yes"> Có</label>
        <label><input type="radio" name="alcohol" value="no" checked> Không</label>
      </div>

      <div class="section">
        <label><strong>Chọn loại hình khuyến mại:</strong></label><br>
        <div class="checkbox-group">
          <label><input type="checkbox" name="promo" value="sample"> Hàng mẫu</label>
          <label><input type="checkbox" name="promo" value="gift"> Tặng hàng hóa/dịch vụ</label>
          <label><input type="checkbox" name="promo" value="discount"> Giảm giá</label>
          <label><input type="checkbox" name="promo" value="voucher"> Tặng phiếu mua hàng</label>
          <label><input type="checkbox" name="promo" value="contest"> Trao thưởng thi</label>
          <label><input type="checkbox" name="promo" value="luckydraw"> Chương trình may rủi</label>
          <label><input type="checkbox" name="promo" value="loyal"> Khách hàng thường xuyên</label>
          <label><input type="checkbox" name="promo" value="other"> Khuyến mại khác</label>
          <label><input type="checkbox" name="promo" value="artist"> Nghệ sĩ biểu diễn</label>
          <label><input type="checkbox" name="promo" value="coupon"> Bán coupon</label>
        </div>
      </div>

      <button type="submit" class="submit-btn">Check Kết Quả</button>
    </form>
  </div>
</body>
</html>
